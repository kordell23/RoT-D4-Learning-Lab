<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Lab 4 · The Lamar Presidency</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M9 2.5h6M10 2.5v6.2L4.6 18.6A1.8 1.8 0 0 0 6.2 21.3h11.6a1.8 1.8 0 0 0 1.6-2.7L14 8.7V2.5' fill='none' stroke='%23171a20' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolygon points='12,14.8 12.62,16.55 14.47,16.6 13,17.72 13.53,19.5 12,18.45 10.47,19.5 11,17.72 9.53,16.6 11.38,16.55' fill='%233e6ae1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f4f4f4; --ink:#171a20; --muted:#5c5e62; --line:#dcdde0;
  --accent:#3e6ae1; --accent-soft:rgba(62,106,225,.10);
  --bad:#c8432f; --bad-soft:rgba(200,67,47,.08); --good:#2f8f5b;
  --font:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171a20; --surface:#22252c; --ink:#eef0f2; --muted:#a2a4a8; --line:#353840;
    --accent:#5b84f0; --accent-soft:rgba(91,132,240,.16); --bad:#e0644f; --bad-soft:rgba(224,100,79,.12); --good:#4cb87c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171a20; --surface:#22252c; --ink:#eef0f2; --muted:#a2a4a8; --line:#353840;
  --accent:#5b84f0; --accent-soft:rgba(91,132,240,.16); --bad:#e0644f; --bad-soft:rgba(224,100,79,.12); --good:#4cb87c;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}

/* ---------- top bar ---------- */
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;transition:background .3s,color .3s;color:#fff}
.bar.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo{width:24px;height:24px;flex:0 0 24px}
.logo .flask{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.logo .fill-line{stroke:currentColor;stroke-width:1.2;opacity:.45;stroke-linecap:round}
.logo .lstar{fill:#5b84f0}
.wordmark{font-weight:500;letter-spacing:.42em;font-size:13px;text-transform:uppercase;white-space:nowrap}
.charge{display:none;align-items:center;gap:10px;font-size:13px;font-weight:500}
.charge.on{display:flex}
.batt{position:relative;width:38px;height:17px;border:1.5px solid currentColor;border-radius:4px;padding:2px}
.batt::after{content:"";position:absolute;right:-5px;top:4px;width:3px;height:6px;border-radius:0 2px 2px 0;background:currentColor}
.batt i{display:block;height:100%;width:0;border-radius:1.5px;background:var(--good);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.charge small{color:var(--muted);font-weight:400}
.bar:not(.solid) .charge small{color:rgba(255,255,255,.7)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#fff;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 108%,rgba(62,106,225,.55) 0%,rgba(62,106,225,.12) 38%,rgba(0,0,0,0) 62%),#000;padding:120px 24px 56px}
.hero::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:38%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(140,170,255,.14) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(140,170,255,.14) 0 1px,transparent 1px 32px);
  transform:perspective(380px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 10%,transparent 95%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%)}
.hero-copy{position:relative;z-index:2}
.hero h1{font-weight:500;font-size:clamp(40px,7vw,72px);line-height:1.04;margin:0 0 14px;letter-spacing:-.01em}
.hero p.sub{margin:0;font-size:15px;color:rgba(255,255,255,.78)}
.star-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vw,480px);z-index:1;pointer-events:none}
.star-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.star-line{fill:none;stroke:#9db7ff;stroke-width:1.2;stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 3.2s cubic-bezier(.6,.05,.25,1) .3s forwards;filter:drop-shadow(0 0 6px rgba(120,160,255,.85)) drop-shadow(0 0 24px rgba(62,106,225,.6))}
.star-fill{fill:rgba(62,106,225,.06);opacity:0;animation:fade 1.6s ease 2.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.signin{position:relative;z-index:2;width:100%;max-width:560px}
.modes{display:flex;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:4px;margin-bottom:10px;backdrop-filter:blur(8px)}
.mode{flex:1;border:0;background:transparent;color:#fff;padding:9px 10px;border-radius:4px;cursor:pointer;transition:background .2s,color .2s}
.mode b{display:block;font-weight:500;font-size:15px}
.mode span{font-size:12px;color:rgba(255,255,255,.65)}
.mode.on{background:#fff;color:#171a20}
.mode.on span{color:#5c5e62}
.mode:disabled{cursor:default}
.mode:disabled:not(.on){opacity:.35}
.fields{display:flex;gap:10px;margin-bottom:14px}
.fields input,.fields select{flex:1;min-width:0;height:44px;border-radius:4px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;backdrop-filter:blur(8px)}
.fields select{flex:0 0 150px}
.fields select option{color:#171a20}
.fields input::placeholder{color:rgba(255,255,255,.6)}
.cta-row{display:flex;gap:12px;justify-content:center}
.pill{height:42px;min-width:220px;padding:0 28px;border-radius:4px;border:0;cursor:pointer;font-weight:500;font-size:14px;transition:transform .15s,background .2s,opacity .2s}
.pill:active{transform:scale(.98)}
.pill.blue{background:var(--accent);color:#fff}
.pill.blue:hover{background:#3457c9}
.pill.ghost{background:rgba(244,244,244,.92);color:#171a20}
.pill:disabled{opacity:.4;cursor:not-allowed}
.signin .msg{min-height:22px;font-size:15px;font-weight:500;color:#ffb4a6;margin-top:12px}

/* ---------- sections ---------- */
.sec{padding:110px 24px 96px;border-top:1px solid var(--line)}
.sec:nth-of-type(even){background:var(--surface)}
.col{max-width:720px;margin:0 auto}
.step{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:500}
.sec h2{font-weight:500;font-size:clamp(32px,5vw,46px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 40px;max-width:60ch}
.sec h3{font-size:19px;font-weight:600;margin:48px 0 6px}
.note{color:var(--muted);font-size:14px;margin:0 0 20px}
.reading{font-size:17px;line-height:1.7;margin:0 0 18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 28px}
.tile{background:var(--bg);padding:20px 22px}
.tile b{display:block;font-size:22px;font-weight:500;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14px}

/* ---------- items ---------- */
.item{margin:0 0 44px}
.kind{font-size:12px;font-weight:600;color:var(--accent);margin:0 0 4px}
.q-prompt{font-weight:500;font-size:17px;margin:0 0 6px}
.how{font-size:13px;color:var(--muted);margin:0 0 12px}
.ibody{margin-top:12px;transition:opacity .2s}
.item.cool .ibody{pointer-events:none;opacity:.55}
.actions{margin-top:14px}
.checkbtn{height:38px;padding:0 24px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;cursor:pointer}
.checkbtn:disabled{opacity:.35;cursor:not-allowed}
.item.solved .actions{display:none}
.fb{font-size:14px;margin:10px 0 0}
.fb.ok{color:var(--good)}
.fb.no{color:var(--bad)}
.fb.soft{color:var(--muted)}

.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .dot{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);position:relative}
.opt .box{flex:0 0 18px;height:18px;border-radius:3px;border:1.5px solid var(--muted);position:relative}
.opt.on{border-color:var(--ink)}
.opt.on .box{background:var(--ink);border-color:var(--ink)}
.opt.on .box::after,.opt.right .dot::after,.opt.right .box::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .dot,.opt.right .box{border-color:var(--accent);background:var(--accent)}
.opt.right .dot::after,.opt.right .box::after{border-color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* chips + zones */
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px;font-weight:500;transition:border-color .15s,box-shadow .15s,background .15s}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip.card{border-radius:4px;padding:9px 12px;text-align:left;line-height:1.35;font-weight:400;width:100%}
.pool .chip.card{width:auto;max-width:100%}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip.good{border-color:var(--accent);background:var(--accent-soft);cursor:default;color:inherit}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.chip.lifting{opacity:.25}
.ghost{position:fixed !important;left:0;top:0;z-index:200;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:.95;margin:0 !important}
.pool{border:1px dashed var(--line);border-radius:6px;padding:10px;margin-bottom:14px;background:var(--bg)}
.pool .zone-in{display:flex;flex-wrap:wrap;gap:8px;min-height:38px;align-items:center}
.pool .zone-in:empty::before{content:"Everything’s placed. Check your work.";color:var(--muted);font-size:13px;padding:0 6px}
.zone.over{border-color:var(--accent) !important;background:var(--accent-soft) !important}
.bins{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.bin{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s}
.bin-h{font-weight:600;font-size:14px;margin:2px 4px 10px}
.bin .zone-in{display:flex;flex-direction:column;gap:6px;min-height:120px}
.mrow{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow p{margin:0;font-size:15px}
.slot{min-height:42px;border:1.5px dashed var(--muted);border-radius:21px;display:flex;align-items:center;justify-content:center;padding:2px;cursor:pointer;transition:border-color .15s,background .15s}
.slot .zone-in{display:flex;justify-content:center;width:100%}
.slot .chip{width:100%;justify-content:center}
.banktext{font-size:17px;line-height:2.4;margin:0}
.islot{display:inline-flex;vertical-align:middle;min-width:150px;min-height:38px;margin:0 4px;border-bottom:2px solid var(--muted);cursor:pointer;justify-content:center;align-items:center;transition:border-color .15s,background .15s;border-radius:3px 3px 0 0}
.islot .chip{line-height:1.2}
.tin{width:150px;border:0;border-bottom:2px solid var(--muted);background:transparent;padding:2px 6px;font-size:17px;font-weight:500;margin:0 4px;border-radius:0}
.tin:focus{outline:none;border-color:var(--accent)}
.tin.bad{border-color:var(--bad);color:var(--bad)}
.tin.good{border-color:var(--accent);color:var(--accent)}
.tflist{display:grid;gap:8px}
.tfrow{display:flex;gap:14px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:10px 10px 10px 16px;background:var(--bg)}
.tfrow p{margin:0;font-size:15px}
.tbtns{display:flex;gap:6px;flex:0 0 auto}
.tbtn{height:34px;min-width:68px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;font-weight:500}
.tbtn:hover:not(:disabled){border-color:var(--ink)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tbtn:disabled{cursor:default}
.tfrow.good{border-color:var(--accent)}
.tfrow.good .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tfrow.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.spot{font-size:21px;line-height:2;margin:0}
.w,.ph{border:0;background:none;padding:1px 3px;border-radius:3px;cursor:pointer;font:inherit;color:inherit;transition:background .15s}
.w:hover:not(:disabled),.ph:hover:not(:disabled){background:var(--accent-soft)}
.w:disabled,.ph:disabled{cursor:default}
.w.right,.ph.right{background:var(--accent);color:#fff}
.w.wrong,.ph.wrong{color:var(--bad);text-decoration:line-through}
.hl{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.hl .src-head{border-bottom:1px solid var(--line)}
.hl-text{margin:0;padding:20px 20px 22px;font-size:18px;line-height:1.9}
.ph{text-align:left}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.orow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 12px;background:var(--bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.orow::before{counter-increment:o;content:counter(o);flex:0 0 18px;font-weight:600;color:var(--muted);font-size:14px}
.orow .grip{color:var(--muted);display:flex}
.orow .otext{flex:1;font-size:15px}
.orow.dragging{border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;z-index:3}
.orow.good{border-color:var(--accent);cursor:default}
.arrows{display:flex;gap:4px}
.arrows button{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px;line-height:1}
.arrows button:hover{border-color:var(--ink)}
.numrow{display:flex;align-items:center;gap:12px}
.nin{width:120px;height:46px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:0 14px;font-size:20px;font-weight:500}
.nin:focus{outline:none;border-color:var(--accent)}
.nin.good{border-color:var(--accent);color:var(--accent)}
.nin.bad{border-color:var(--bad)}
.numrow span{color:var(--muted)}

/* sources + data */
.source{border:1px solid var(--line);border-radius:6px;background:var(--bg);margin:26px 0 18px;overflow:hidden}
.src-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 20px;font-size:14px}
.source .src-head{border-bottom:1px solid var(--line)}
.src-head b{font-weight:600;flex:0 0 auto}
.src-head span{color:var(--muted);text-align:right}
.source blockquote{margin:0;padding:22px 22px 24px;font-size:18px;line-height:1.65}
.source blockquote p{margin:0 0 10px}
.source blockquote p:last-child{margin:0}
.lang-note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 28px}
.bars{margin:18px 0 30px}
.brow{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center;margin:0 0 12px;font-size:14px}
.btrack{height:30px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bfill{height:100%;background:var(--accent);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-weight:500;font-size:13px;white-space:nowrap;min-width:84px}
.bars .src{font-size:12px;color:var(--muted)}

/* unlock, locked, done */
.unlock{margin-top:44px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.unlock .pill{min-width:240px}
.unlock .status{font-size:14px;color:var(--muted)}
.sec.locked{padding:60px 24px}
.lockcard{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:18px;color:var(--muted)}
.lockcard svg{flex:0 0 28px}
.lockcard b{color:var(--ink);font-weight:500;display:block}
.donebar{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.donebar .t{display:flex;align-items:center;gap:12px;font-weight:500}
.check{width:22px;height:22px;border-radius:50%;background:var(--good);position:relative;flex:0 0 22px}
.check::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:500;font-size:14px;padding:4px 0}
.sec.done{padding:26px 24px}
.sec.done.open{padding:26px 24px 80px}
.sec.done .body{display:none}
.sec.done.open .body{display:block;margin-top:40px}

/* exit ticket */
.field{margin:0 0 28px}
.field label{display:block;font-weight:500;font-size:17px;margin:0 0 6px}
.field .hintline{color:var(--muted);font-size:14px;margin:0 0 10px}
.field textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:14px 16px;line-height:1.55}
.field textarea:focus{border-color:var(--accent);outline:none}
.field .err{font-size:13px;color:var(--bad);margin-top:6px;min-height:18px}
.words{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.words span{font-size:13px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);transition:all .2s}
.words span.hit{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}


/* exit ticket layout + sources panel */
.sec#sec-exit:not(.done){padding-left:24px;padding-right:24px}
.exitwrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:start}
.srcpanel{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px 12px}
.sp-head b{font-weight:600}
.sp-head span{font-size:12px;color:var(--muted);text-align:right}
.sp-tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}
.sp-tab{flex:1;border:0;background:none;padding:10px 4px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sp-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.sp-body{padding:16px 18px 18px}
.sp-by{font-size:13px;color:var(--muted);margin:0 0 10px}
.sp-quote{font-size:16px;line-height:1.65}
.sp-quote p{margin:0 0 10px}
.sp-note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0 16px}

<script>
(function(){
"use strict";

/* ============================================================
   CONTENT  (lvl: "adv" = Advanced only; anything else = both)
   ============================================================ */
const VOCAB = ["annexation","debt","tariff","Manifest Destiny"];

const SECTIONS = [
{ id:"review", title:"Systems check", step:"Days 1–3 review",
  lede:"Before you open the Lamar file, prove you remember how the Republic got here. Every answer has to be right to move on.",
  blocks:[
    {t:"order", id:"r0", prompt:"Put these events in the order they happened.",
      items:["Texans defeat Santa Anna at San Jacinto","Sam Houston is elected the first president of the Republic","The United States turns down Texas’s first request for annexation","Vicente Córdova leads a rebellion in East Texas","Mirabeau B. Lamar is elected president"],

    {t:"mc", id:"r1", prompt:"When Texas became independent in 1836, which of these was NOT one of its big problems?",
      opts:["The government owed money from fighting the Revolution","Native nations were fighting settlers moving onto their land","The treasury had more money than it could spend","Mexico refused to recognize Texas independence"], a:2,
      ok:"Right. The Republic was broke, so a full treasury was never the problem.", hint:"Three of these were real problems. Which one would actually be good news?"},
    {t:"multi", id:"r2", prompt:"Which of these were part of Sam Houston’s plan in his first term?",
      opts:["Replace the army with the Texas Rangers","Put tariffs on goods to raise money","Build a line of forts along the frontier","Move the capital to Austin","Go to war to remove all Native peoples","Make peace treaties and trade with Native nations"], a:[0,1,2,5],
      ok:"All four. Houston’s plan was to spend less, raise money, and keep the peace.", hint:"Houston wanted to save money and keep peace. Two of these choices belong to someone else."},
    {t:"mc", id:"r3", lvl:"adv", prompt:"Why did the United States turn Texas down the first time it asked to join?",
      opts:["Texas was too small to become a state","Adding Texas as a slave state would upset the balance of free and slave states, and it could start trouble with Mexico","Most Texans voted against joining","The U.S. had already added too many states that year"], a:1,

    {t:"mc", id:"r4", lvl:"adv", prompt:"What was one result of the Córdova Rebellion?",
      opts:["Texas became part of Mexico again","Many Anglos distrusted Native Texans and Tejanos even more","Houston resigned as president","Tejanos were given more land in East Texas"], a:1,
      ok:"Yes. The rebellion was defeated, and distrust grew. Keep that in mind for what Lamar does next.", hint:"The rebels lost. How did Anglo Texans feel afterward?"}
  ]},

{ id:"vocab", title:"Vocab lab", step:"Unit vocabulary",
  lede:"Knowing a definition isn’t enough. You have to match it, use it, and catch it when someone uses it wrong.",
  blocks:[
    {t:"match", id:"v1", prompt:"Match each vocab word to what it means.", words:VOCAB,
      rows:[["Money a person or government owes and has to pay back",1],["When a country officially adds new territory to itself",0],["A tax charged on goods brought in from another country",2],["The belief that the U.S. was meant to stretch from the Atlantic to the Pacific",3]],
      ok:"All matched.", hint:"Start with the one you’re surest about, then work through the rest."},
    {t:"bank", id:"v2", prompt:"Use the word bank to complete the paragraph.", words:VOCAB,
      text:"After the Revolution, Texas owed so much money that its {0} was over $1 million. To bring money in, Houston put a {1} on goods shipped in from other countries. Most Texans wanted {2} because they hoped to join the United States. Years later, Americans who believed in {3} said the country should stretch from coast to coast.",
      blanks:[1,2,0,3], ok:"That paragraph reads right.", hint:"Read each sentence all the way through before you pick a word."},
    {t:"spot", id:"v3", prompt:"One word in this sentence is used wrong. Find it.",
      sentence:"Lamar put a tariff on the Cherokee to force them out of East Texas.", a:3,
      ok:"Right, it’s “tariff.” A tariff is a tax on imported goods, not a way to remove people. Lamar used military force.", hint:"Which vocab word doesn’t fit what’s happening here?"},
    {t:"spot", id:"v4", lvl:"adv", prompt:"Find the word that makes this sentence wrong.",
      sentence:"Manifest Destiny was a law the Texas Congress passed in 1838.", a:4,
      ok:"Exactly. Manifest Destiny was a belief many Americans held, not a law.", hint:"Is Manifest Destiny a rule a government wrote, or an idea people believed?"},
    {t:"tf", id:"v5", lvl:"adv", prompt:"True or false?",
      rows:[["If Texas spends more money than it collects, its debt grows.",true],["A tariff is money the government borrows from another country.",false],["Lamar opposed annexation because he wanted Texas to stay independent.",true],["Manifest Destiny was mostly about Texas staying a separate nation.",false]],
      ok:"All four right.", hint:"Check each one against the definitions you matched above."}
  ]},

{ id:"lamar", title:"The Lamar file", step:"Today’s lesson",
  lede:"Read the file, then answer the questions. Everything you need is on this screen.",
  blocks:[
    {t:"p", html:"In 1838, Sam Houston’s term was over, and the Constitution of 1836 didn’t let a president serve two terms in a row. Houston’s vice president, <b>Mirabeau B. Lamar</b>, was popular and won the election easily. Lamar had very different plans for Texas."},
    {t:"tiles", items:[
      ["Annexation","Opposed it. Lamar wanted Texas to stay an independent nation."],
      ["Native Texans","Wanted all Native peoples removed from Texas, by force if needed."],
      ["Spending","Spent large amounts of money on the military and big projects. The debt kept climbing."],
      ["Education","Pushed for public schools and universities. Known as the “Father of Texas Education.”"],
      ["The capital","Moved it from Houston to Austin so it would be more centrally located."],
      ["The result","A bigger, bolder Texas on paper, and a Republic sinking deeper into debt."]]},
    {t:"h", text:"Clash on the Neches"},
    {t:"p", html:"Lamar ordered <b>Chief Bowles</b> and the Cherokee to leave East Texas. The Cherokee refused. In July 1839, Texas forces, including the Texas Rangers, were sent to force them out, and the Cherokee fought back in the <b>Battle of the Neches</b>. Chief Bowles and more than 100 Cherokee were killed, and the rest were driven out of Texas into present-day Oklahoma. Lamar’s Native policy added even more to the Republic’s debt."},
    {t:"mc", id:"l1", prompt:"Why was Lamar able to win the election of 1838?",
      opts:["Mexico chose him as the new leader of Texas","He had already served one term as president","He was Houston’s vice president and was widely popular","The U.S. Congress appointed him"], a:2,
      ok:"Right. Lamar was well known and popular, and Houston couldn’t run again right away.", hint:"What job did Lamar have under Houston?"},
    {t:"typed", id:"l2", prompt:"Type the missing cities.",
      text:"Lamar moved the capital from {0} to {1} because he wanted it to be more centrally located.", answers:[["Houston"],["Austin"]],
      ok:"Correct. Houston to Austin.", hint:"Check the “The capital” tile above."},
    {t:"tf", id:"l3", prompt:"True or false?",
      rows:[["Lamar supported annexation to the United States.",false],["Lamar is known as the “Father of Texas Education.”",true],["After the Battle of the Neches, the Cherokee were driven into present-day Oklahoma.",true],["Lamar’s policy toward Native Texans helped lower the debt.",false]],
      ok:"All four right.", hint:"Reread the tiles and the Neches paragraph."},
    {t:"order", id:"l4", lvl:"adv", prompt:"Put this chain of causes and effects in order.",

      ok:"That’s the chain. Each step caused the next one.", hint:"Ask yourself: what had to happen first for this to happen?"},
    {t:"mc", id:"l5", lvl:"adv", prompt:"Which of Lamar’s choices made the Republic’s debt problem worse?",
      opts:["Signing peace and trade treaties with Native nations","Waging expensive wars to remove Native Texans","Replacing the army with the Texas Rangers to save money","Cutting government spending"], a:1,
      ok:"Right. War costs money, and Texas had to borrow to pay for it.", hint:"Three of these sound like Houston. Which one sounds like Lamar?"}
  ]},

{ id:"sources", title:"Source analysis", step:"Primary sources",
  lede:"Historians don’t just read what happened. They read what people said, then ask who said it, when, and why.",
  blocks:[
    {t:"note", text:"Word help for Source A: a “cultivated mind” is an educated mind. A “guardian” protects something."},
    {t:"hl", id:"s1", prompt:"According to Lamar, what protects democracy?",
      label:"Source A", by:"Mirabeau B. Lamar, message to the Texas Congress, December 21, 1838",
      phrases:["“Cultivated mind","is the guardian genius of Democracy,","and while guided and controlled by virtue,","the noblest attribute of man.","It is the only dictator that freemen acknowledge,","and the only security which freemen desire.”"], a:0,
      ok:"Exactly. To Lamar, educated citizens protect a free country.", hint:"Look for the thing he calls the “guardian.”"},
    {t:"typed", id:"s2", lvl:"adv", prompt:"Finish the sentence.",
      text:"Source A helped earn Lamar the nickname “Father of Texas {0}.”", answers:[["Education"]],
      ok:"Right. Today a Latin version of his line is the University of Texas motto.", hint:"Source A is all about schools and learning."},
    {t:"src", label:"Source B", by:"Mirabeau B. Lamar, message to the Texas Congress, 1839",
      html:"<p>“The white man and the red man cannot dwell in harmony together. Nature forbids it.”</p><p>His plan was “to push a rigorous war against them; pursuing them to their hiding places without mitigation or compassion, until they shall be made to feel that flight from our borders without hope of return, is preferable to the scourges of war.”</p>"},
    {t:"note", text:"Historical language: Lamar uses a term for Native Americans that was common in the 1800s and is offensive today. “Without mitigation or compassion” means without holding back or showing mercy."},
    {t:"mc", id:"s3", prompt:"According to Source B, what did Lamar want Texas to do?",
      opts:["Make war on Native peoples until they left Texas for good","Trade with Native nations to build friendship","Share land equally with Native nations","Ask the United States to protect Native nations"], a:0,
      ok:"Right. He wanted them gone, with no hope of coming back.", hint:"What does “flight from our borders” mean?"},
    {t:"typed", id:"s4", lvl:"adv", prompt:"Close reading: finish the phrase from Source B.",
      text:"Lamar wanted Native peoples to flee Texas “without hope of {0}.”", answers:[["return"]],
      ok:"Yes. In plain words, they could never come back.", hint:"The word is in the last part of Source B."},
    {t:"mc", id:"s5", lvl:"adv", prompt:"Which event from today’s lesson shows Source B’s policy being put into action?",

    {t:"src", label:"Source C", by:"Sam Houston, message to the chiefs of the border tribes, second term (early 1840s)",

    {t:"bins", id:"s7", prompt:"Who said it? Sort each quote to the president who said it.", bins:["Houston","Lamar"],

      ok:"All sorted. Same Republic, two completely different voices.", hint:"Ask: does this quote sound like peace, war, or education?"},
    {t:"src", lvl:"adv", label:"Source D", by:"Sam Houston, speech in the U.S. Senate years later, looking back on the Republic",
      html:"<p>“For the years I have mentioned, in Texas, we had perfect peace, and, mark you, it did not cost the government over $10,000.00 a year. We had no standing army. A new administration came in and the Congress immediately appropriated $1,500,000.00 for the creation of two regular regiments… He announced the extermination of the Indians.”</p>"},
    {t:"note", lvl:"adv", text:"Word help: “appropriated” means set aside money to spend. A “regiment” is a large group of soldiers."},
    {t:"mc", id:"s8", lvl:"adv", prompt:"According to Houston, what changed when the “new administration” (Lamar) took over?",

    {t:"mc", id:"s9", lvl:"adv", prompt:"Why should a historian be careful when using Source D?",

  {id:"e1", kind:"compare",

const SOURCES = [
  {key:"A", by:"Mirabeau B. Lamar, message to the Texas Congress, December 21, 1838",

const ITEM_TYPES = new Set(["mc","multi","order","bins","match","bank","typed","tf","spot","hl","num"]);
const KIND = {mc:"Multiple choice",multi:"Select all that apply",order:"Put in order",bins:"Drag and drop",match:"Matching",bank:"Fill in the blank",typed:"Type the answer",tf:"True or false",spot:"Spot the mistake",hl:"Evidence hunt",num:"Do the math"};
const HOW = {order:"Drag the cards into order, or use the arrows.",bins:"Drag each card into the right column, or tap a card and then tap a column.",match:"Drag each word onto its meaning, or tap a word and then tap a blank.",bank:"Drag a word into each blank, or tap a word and then tap a blank.",spot:"Tap the word that’s wrong.",hl:"Tap the part of the quote that answers the question.",multi:"Pick every correct answer, then check.",tf:"Mark each statement, then check.",typed:"Type in each blank, then check."};
const MODE_LABEL = {reg:"Regular", adv:"Advanced"};

/* ============================================================
   STATE
   ============================================================ */
const KEY = "learning-lab-04-lamar-v2";
const blank = () => ({mode:"", name:"", period:"", started:0, ans:{}, done:[], open:{}, exit:{}, finished:0, secT:{}, exitChecks:{}, submitTries:0, away:0});
let S = blank();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(blank(), JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const inMode = x => x.lvl !== "adv" || S.mode === "adv";
const blocksOf = sec => sec.blocks.filter(inMode);
const itemsOf = sec => blocksOf(sec).filter(b=>ITEM_TYPES.has(b.t));
const allItems = () => SECTIONS.flatMap(itemsOf);
const exitQs = () => EXIT.filter(inMode);
const ITEM = {}; SECTIONS.forEach(sec=>sec.blocks.forEach(b=>{ if(ITEM_TYPES.has(b.t)){ b.sec = sec.id; ITEM[b.id] = b; } }));

/* helpers */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function shuffle(arr, seed){
  let t = hash(seed+S.mode); const r = ()=>{ t+=0x6D2B79F5; let x=Math.imul(t^t>>>15,1|t); x^=x+Math.imul(x^x>>>7,61|x); return ((x^x>>>14)>>>0)/4294967296; };
  const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const solved = id => !!(S.ans[id]||{}).correct;
const GRIP = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></g></svg>';

/* ============================================================
   ITEM RENDERERS
   ============================================================ */
const chipBtn = (key, label, extra, sv, card) => `<button type="button" class="chip${card?" card":""}${extra||""}" data-chip="${esc(key)}" ${sv?"disabled":""}>${esc(label)}</button>`;
const poolHTML = inner => `<div class="zone pool" data-zone="pool"><div class="zone-in">${inner}</div></div>`;

const BODY = {
  mc:(it,sv)=>`<div class="opts">${it.opts.map((o,j)=>`<button type="button" class="opt${sv?(j===it.a?" right":" dim"):""}" data-pick="${j}" ${sv?"disabled":""}><span class="dot" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join("")}</div>`,

  multi:(it,sv)=>`<div class="opts">${it.opts.map((o,j)=>{ const c=it.a.includes(j);
      return `<button type="button" class="opt${sv?(c?" right":" dim"):""}" data-multi="${j}" aria-pressed="${sv&&c}" ${sv?"disabled":""}><span class="box" aria-hidden="true"></span><span>${esc(o)}</span></button>`; }).join("")}</div>`,

  order:(it,sv)=>{ let idx = it.items.map((_,i)=>i);
      if(!sv){ idx = shuffle(idx, it.id); if(idx.every((v,i)=>v===i)) idx.reverse(); }
      return `<ol class="olist">${idx.map(v=>`<li class="orow${sv?" good":""}" data-v="${v}"><span class="grip">${GRIP}</span><span class="otext">${esc(it.items[v])}</span>${sv?"":`<span class="arrows"><button type="button" data-move="-1" aria-label="Move up">↑</button><button type="button" data-move="1" aria-label="Move down">↓</button></span>`}</li>`).join("")}</ol>`; },

  bins:(it,sv)=>{ const bins = (S.mode==="adv" && it.binsAdv) ? it.binsAdv : it.bins; const cards = it.cards.filter(inMode);
      const chip = (c,i,x)=>`<button type="button" class="chip card${x}" data-chip="${i}" data-a="${esc(c.a)}" ${sv?"disabled":""}>${esc(c.text)}</button>`;
      return `${sv?"":poolHTML(shuffle(cards.map((c,i)=>[c,i]), it.id).map(([c,i])=>chip(c,i,"")).join(""))}
        <div class="bins" style="--n:${bins.length}">${bins.map(b=>`<div class="zone bin" data-zone="${esc(b)}" ${sv?"":`tabindex="0" role="button" aria-label="${esc(b)} column"`}><div class="bin-h">${esc(b)}</div><div class="zone-in">${sv?cards.map((c,i)=>c.a===b?chip(c,i," good"):"").join(""):""}</div></div>`).join("")}</div>`; },

  match:(it,sv)=>`${sv?"":poolHTML(shuffle(it.words.map((_,i)=>i), it.id).map(i=>chipBtn(i, it.words[i], "", false)).join(""))}
      <div class="mlist">${it.rows.map(([def,a],ri)=>`<div class="mrow"><div class="zone slot" data-zone="s${ri}" data-cap="1" data-a="${a}" ${sv?"":`tabindex="0" role="button" aria-label="Blank for: ${esc(def)}"`}><div class="zone-in">${sv?chipBtn(a, it.words[a], " good", true):""}</div></div><p>${esc(def)}</p></div>`).join("")}</div>`,

  bank:(it,sv)=>`${sv?"":poolHTML(shuffle(it.words.map((_,i)=>i), it.id).map(i=>chipBtn(i, it.words[i], "", false)).join(""))}
      <p class="banktext">${esc(it.text).replace(/\{(\d+)\}/g,(m,k)=>{ const a = it.blanks[+k];
        return `<span class="zone islot" data-zone="b${k}" data-cap="1" data-a="${a}" ${sv?"":`tabindex="0" role="button" aria-label="Blank ${+k+1}"`}><span class="zone-in">${sv?chipBtn(a, it.words[a], " good", true):""}</span></span>`; })}</p>`,

  typed:(it,sv)=>`<p class="banktext">${esc(it.text).replace(/\{(\d+)\}/g,(m,k)=>`<input class="tin${sv?" good":""}" data-blank="${k}" aria-label="Blank ${+k+1}" autocomplete="off" autocapitalize="off" spellcheck="false" ${sv?`value="${esc(it.answers[+k][0])}" disabled`:""}>`)}</p>`,

  tf:(it,sv)=>`<div class="tflist">${it.rows.map(([s,a],ri)=>`<div class="tfrow${sv?" good":""}" data-row="${ri}" data-a="${a?1:0}"><p>${esc(s)}</p><div class="tbtns"><button type="button" class="tbtn${sv&&a?" on":""}" data-tf="1" ${sv?"disabled":""}>True</button><button type="button" class="tbtn${sv&&!a?" on":""}" data-tf="0" ${sv?"disabled":""}>False</button></div></div>`).join("")}</div>`,

  spot:(it,sv)=>`<p class="spot">${it.sentence.split(" ").map((w,i)=>`<button type="button" class="w${sv&&i===it.a?" right":""}" data-pick="${i}" ${sv?"disabled":""}>${esc(w)}</button>`).join(" ")}</p>`,

  hl:(it,sv)=>`<figure class="hl" style="margin:0"><div class="src-head"><b>${esc(it.label)}</b><span>${esc(it.by)}</span></div><p class="hl-text">${it.phrases.map((p,i)=>`<button type="button" class="ph${sv&&i===it.a?" right":""}" data-pick="${i}" ${sv?"disabled":""}>${esc(p)}</button>`).join(" ")}</p></figure>`,

  num:(it,sv)=>`<div class="numrow"><input class="nin${sv?" good":""}" type="text" inputmode="decimal" aria-label="Your answer" autocomplete="off" ${sv?`value="${esc(it.show)}" disabled`:""}><span>${esc(it.unit||"")}</span></div>`
};
const needsCheck = t => !["mc","spot","hl"].includes(t);

function itemHTML(it){
  const sv = solved(it.id);
  return `<div class="item${sv?" solved":""}" data-item="${it.id}">
    <p class="kind">${KIND[it.t]}</p>
    <p class="q-prompt">${esc(it.prompt)}</p>
    ${HOW[it.t] && !sv ? `<p class="how">${HOW[it.t]}</p>` : ""}
    <div class="ibody">${BODY[it.t](it, sv)}</div>
    ${needsCheck(it.t) ? `<div class="actions"><button type="button" class="checkbtn" data-check="${it.id}">Check</button></div>` : ""}
    <p class="fb${sv?" ok":""}" data-fb="${it.id}" aria-live="polite">${sv?esc(it.ok):""}</p></div>`;
}

function blockHTML(b){
  if(ITEM_TYPES.has(b.t)) return itemHTML(b);
  switch(b.t){
    case "h": return `<h3>${esc(b.text)}</h3>${b.note?`<p class="note">${esc(b.note)}</p>`:""}`;
    case "p": return `<p class="reading">${b.html}</p>`;
    case "note": return `<p class="lang-note">${esc(b.text)}</p>`;
    case "tiles": return `<div class="tiles">${b.items.map(([k,v])=>`<div class="tile"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}</div>`;
    case "src": return `<figure class="source"><div class="src-head"><b>${esc(b.label)}</b><span>${esc(b.by)}</span></div><blockquote>${b.html}</blockquote></figure>`;
    case "bars": return `<div class="bars">${b.rows.map(r=>`<div class="brow"><span>${esc(r[0])}</span><div class="btrack"><div class="bfill" style="width:${r[2]}%">${esc(r[1])}</div></div></div>`).join("")}<p class="src">${esc(b.src)}</p></div>`;
  }
  return "";
}

/* ============================================================
   PAGE RENDER
   ============================================================ */
const main = document.getElementById("main");

function render(){
  main.innerHTML = "";
  if(!S.started){ updateCharge(); renderResults(); return; }
  const cur = S.done.length, n = SECTIONS.length;
  SECTIONS.forEach((sec,i)=>{
    const el = document.createElement("section");
    el.className = "sec"; el.id = "sec-"+sec.id;
    const body = blocksOf(sec).map(blockHTML).join("");
    if(i < cur){
      el.classList.add("done"); if(S.open[sec.id]) el.classList.add("open");
      el.innerHTML = `<div class="donebar"><div class="t"><span class="check" aria-hidden="true"></span>${esc(sec.title)}</div><button class="linkbtn" type="button" data-toggle="${sec.id}">${S.open[sec.id]?"Hide":"Review"}</button></div><div class="body col">${body}</div>`;
    } else if(i === cur){
      if(!S.secT[sec.id]){ S.secT[sec.id] = {start: S.secT.lastEnd || S.started || Date.now()}; save(); }
      el.innerHTML = `<div class="col"><p class="step">Section ${i+1} of ${n} · ${esc(sec.step)}</p><h2>${esc(sec.title)}</h2><p class="lede">${esc(sec.lede)}</p>${body}
        <div class="unlock"><button class="pill blue" type="button" data-unlock="${sec.id}" disabled>${i===n-1?"Unlock exit ticket":"Unlock next section"}</button><span class="status" data-status="${sec.id}"></span></div></div>`;
    } else if(i === cur+1){
      el.classList.add("locked"); el.innerHTML = lockCard(sec.title, `Finish ${SECTIONS[cur].title.toLowerCase()} to unlock.`);
    } else return;
    main.appendChild(el);
  });
  if(cur === n-1){
    const lk = document.createElement("section"); lk.className = "sec locked";
    lk.innerHTML = lockCard("Exit ticket", `Finish ${SECTIONS[n-1].title} to unlock.`); main.appendChild(lk);
  }
  if(cur >= n){
    if(!S.secT.exit){ S.secT.exit = {start: S.secT.lastEnd || Date.now()}; save(); }
    const ex = document.createElement("section"); ex.className = "sec"; ex.id = "sec-exit";
    if(S.finished){ ex.classList.add("done"); ex.innerHTML = `<div class="donebar"><div class="t"><span class="check" aria-hidden="true"></span>Exit ticket</div></div>`; }
    else ex.innerHTML = exitHTML();
    main.appendChild(ex);
  }
  SECTIONS.forEach(refreshUnlock);
  wireExit(); updateCharge(); renderResults();
}

function lockCard(title, sub){
  return `<div class="lockcard"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><div><b>${esc(title)}</b>${esc(sub)}</div></div>`;
}

function refreshUnlock(sec){
  const btn = main.querySelector(`[data-unlock="${sec.id}"]`); if(!btn) return;
  const ids = itemsOf(sec).map(b=>b.id), got = ids.filter(solved).length;
  btn.disabled = got < ids.length;
  main.querySelector(`[data-status="${sec.id}"]`).textContent = got < ids.length ? `${got} of ${ids.length} complete` : "Section cleared";
  updateCharge();
}

function updateCharge(){
  const items = allItems(), total = items.length + 1;
  const got = items.filter(b=>solved(b.id)).length + (S.finished?1:0);
  const pct = S.started ? Math.round(got/total*100) : 0;
  document.getElementById("battFill").style.width = pct+"%";
  document.getElementById("battPct").textContent = pct+"%";
  document.getElementById("charge").classList.toggle("on", !!S.started);
}

/* ============================================================
   GRADING
   ============================================================ */
const COOLDOWN = 3;
function itemEl(id){ return main.querySelector(`[data-item="${id}"]`); }
function fbEl(id){ return main.querySelector(`[data-fb="${id}"]`); }

function solve(it){
  const rec = S.ans[it.id] || {tries:0}; rec.tries++; rec.correct = true; rec.first = rec.tries === 1; rec.at = Date.now();
  S.ans[it.id] = rec; save();
  const el = itemEl(it.id); if(el) el.outerHTML = itemHTML(it);
  refreshUnlock(SECTIONS.find(s=>s.id===it.sec));
}

function fail(it, msg, after, detail){
  const rec = S.ans[it.id] || {tries:0}; rec.tries++; (rec.wrongs = rec.wrongs || []).push(detail || msg || "Wrong answer"); S.ans[it.id] = rec; save();
  const el = itemEl(it.id), fb = fbEl(it.id), cb = el.querySelector(".checkbtn");
  el.classList.add("cool"); if(cb) cb.disabled = true;
  const base = (msg ? msg+" " : "") + it.hint;
  let left = COOLDOWN; fb.className = "fb no"; fb.textContent = `${base} Try again in ${left}s.`;
  setTimeout(()=>{ if(after) after(); }, 900);
  const t = setInterval(()=>{
    left--;
    if(left <= 0){ clearInterval(t); el.classList.remove("cool"); if(cb) cb.disabled = false; if(!solved(it.id)) fb.textContent = base; }
    else fb.textContent = `${base} Try again in ${left}s.`;
  },1000);
}

function softMsg(it, msg){ const fb = fbEl(it.id); fb.className = "fb soft"; fb.textContent = msg; }

function pick(it, btn){
  if(+btn.dataset.pick === it.a) return solve(it);
  btn.disabled = true; btn.classList.add("wrong"); fail(it, "", null, btn.textContent.trim());
}

function slotCheck(it, el){
  const slots = [...el.querySelectorAll("[data-cap]")];
  if(slots.some(s=>!s.querySelector(".chip"))) return softMsg(it, "Fill every blank before you check.");
  const wrong = [];
  slots.forEach(s=>{ const c = s.querySelector(".chip"); if(c.dataset.chip === s.dataset.a){ c.classList.add("good"); c.disabled = true; } else { c.classList.add("bad"); wrong.push(c); } });
  if(!wrong.length) return solve(it);
  fail(it, `${wrong.length} ${wrong.length>1?"words were":"word was"} in the wrong spot and went back to the bank.`, ()=>{ const pool = el.querySelector(".pool .zone-in"); wrong.forEach(c=>{ c.classList.remove("bad"); pool.appendChild(c); }); });
}

function check(it){
  const el = itemEl(it.id);
  switch(it.t){
    case "multi": {
      const sel = [...el.querySelectorAll("[data-multi].on")].map(b=>+b.dataset.multi);
      if(!sel.length) return softMsg(it, "Pick at least one answer.");
      const good = sel.filter(i=>it.a.includes(i)).length, bad = sel.length - good;
      if(!bad && good === it.a.length) return solve(it);
      return fail(it, `You have ${good} of the correct answers${bad?` and ${bad} that ${bad>1?"don’t":"doesn’t"} belong`:""}.`, null, "Picked: " + sel.map(i=>it.opts[i]).join(", "));
    }
    case "order": {
      const v = [...el.querySelectorAll(".orow")].map(r=>+r.dataset.v), n = v.filter((x,i)=>x===i).length;
      if(n === v.length) return solve(it);
      return fail(it, `${n} of ${v.length} are in the right spot.`);
    }
    case "bins": {
      if(el.querySelector(".pool .chip")) return softMsg(it, "Place every card before you check.");
      const chips = [...el.querySelectorAll(".bins .chip:not(.good)")], wrong = [];
      chips.forEach(c=>{ if(c.closest("[data-zone]").dataset.zone === c.dataset.a){ c.classList.add("good"); c.disabled = true; } else { c.classList.add("bad"); wrong.push(c); } });
      if(!wrong.length) return solve(it);
      return fail(it, `${wrong.length} ${wrong.length>1?"cards were":"card was"} in the wrong column and went back to the pile.`, ()=>{ const pool = el.querySelector(".pool .zone-in"); wrong.forEach(c=>{ c.classList.remove("bad"); pool.appendChild(c); }); });
    }
    case "match": case "bank": return slotCheck(it, el);
    case "typed": {
      const ins = [...el.querySelectorAll(".tin")];
      if(ins.some(i=>!i.value.trim())) return softMsg(it, "Fill in every blank before you check.");
      let bad = 0;
      const typedVals = ins.map(i=>i.value.trim()).join(" / ");
      ins.forEach(i=>{ const ok = it.answers[+i.dataset.blank].map(norm).includes(norm(i.value)); i.classList.toggle("bad", !ok); i.classList.toggle("good", ok); if(ok) i.disabled = true; else bad++; });
      if(!bad) return solve(it);
      return fail(it, `Check your spelling and the reading. ${bad} ${bad>1?"blanks aren’t":"blank isn’t"} right yet.`, null, "Typed: " + typedVals);
    }
    case "tf": {
      const rows = [...el.querySelectorAll(".tfrow:not(.good)")];
      if(rows.some(r=>!r.querySelector(".tbtn.on"))) return softMsg(it, "Mark every statement before you check.");
      const wrong = [];
      rows.forEach(r=>{ if(r.querySelector(".tbtn.on").dataset.tf === r.dataset.a){ r.classList.add("good"); r.querySelectorAll(".tbtn").forEach(b=>b.disabled=true); } else { r.classList.add("bad"); wrong.push(r); } });
      if(!wrong.length) return solve(it);
      return fail(it, `${wrong.length} ${wrong.length>1?"statements are":"statement is"} marked wrong.`, ()=>wrong.forEach(r=>{ r.classList.remove("bad"); r.querySelectorAll(".tbtn").forEach(b=>b.classList.remove("on")); }));
    }
    case "num": {
      const inp = el.querySelector(".nin"), v = parseFloat(String(inp.value).replace(/[^0-9.\-]/g,""));
      if(isNaN(v)) return softMsg(it, "Type a number first.");
      if(v >= it.min && v <= it.max) return solve(it);
      inp.classList.add("bad"); return fail(it, "Not quite.", ()=>inp.classList.remove("bad"), "Typed: " + inp.value.trim());
    }
  }
}

/* ============================================================
   DRAG + TAP ENGINE (works with mouse, touch, and keyboard)
   ============================================================ */
let selChip = null, drag = null, odrag = null, lastDrag = 0;
const itemOf = el => ITEM[el.closest("[data-item]").dataset.item];
const live = el => { const it = el.closest("[data-item]"); return it && !it.classList.contains("solved") && !it.classList.contains("cool"); };
function unselect(){ if(selChip) selChip.classList.remove("sel"); selChip = null; }

function place(chip, zone){
  const item = zone.closest("[data-item]"); if(!item || item !== chip.closest("[data-item]")) return;
  const inner = zone.querySelector(".zone-in") || zone;
  if(zone.dataset.cap === "1"){
    const ex = inner.querySelector(".chip");
    if(ex && ex !== chip){
      if(ex.disabled) return;
      const from = chip.closest("[data-zone]");
      if(from && from.dataset.cap === "1") (from.querySelector(".zone-in")||from).appendChild(ex);
      else item.querySelector(".pool .zone-in").appendChild(ex);
    }
  }
  inner.appendChild(chip); chip.classList.remove("bad");
  const fb = fbEl(item.dataset.item); if(fb.classList.contains("soft")){ fb.textContent = ""; fb.className = "fb"; }
}

function zoneAt(x, y, item){
  const el = document.elementFromPoint(x, y); if(!el) return null;
  const z = el.closest("[data-zone]"); return z && z.closest("[data-item]") === item ? z : null;
}

main.addEventListener("pointerdown", e=>{
  const chip = e.target.closest(".chip");
  if(chip && !chip.disabled && live(chip)){ drag = {chip, x:e.clientX, y:e.clientY, moved:false, ghost:null, over:null}; return; }
  const row = e.target.closest(".orow");
  if(row && !e.target.closest("button") && live(row)){ odrag = {row, moved:false, y:e.clientY}; }
});
window.addEventListener("pointermove", e=>{
  if(drag){
    if(!drag.moved){
      if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
      drag.moved = true; unselect();
      const r = drag.chip.getBoundingClientRect(), g = drag.chip.cloneNode(true);
      g.classList.add("ghost"); g.style.width = r.width+"px"; drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
      document.body.appendChild(g); drag.ghost = g; drag.chip.classList.add("lifting");
    }
    drag.ghost.style.transform = `translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px)`;
    const z = zoneAt(e.clientX, e.clientY, drag.chip.closest("[data-item]"));
    if(z !== drag.over){ if(drag.over) drag.over.classList.remove("over"); if(z) z.classList.add("over"); drag.over = z; }
    e.preventDefault();
  } else if(odrag){
    if(!odrag.moved){ if(Math.abs(e.clientY-odrag.y) < 5) return; odrag.moved = true; odrag.row.classList.add("dragging"); }
    const list = odrag.row.parentElement;
    for(const r of list.children){
      if(r === odrag.row) continue;
      const b = r.getBoundingClientRect();
      if(e.clientY > b.top && e.clientY < b.bottom){
        if(e.clientY < b.top + b.height/2) list.insertBefore(odrag.row, r); else list.insertBefore(odrag.row, r.nextSibling);
        break;
      }
    }
    e.preventDefault();
  }
}, {passive:false});

/* ---------- exit ticket: auto-feedback ---------- */
const NEG = /\b(not|no|never|didn'?t|did not|wasn'?t|was not|against|oppos\w*|refus\w*|instead of|rather than)\b/;
function clauses(t){ return t.split(/[.;!?,]|\b(?:but|while|whereas|however|and|unlike|although|though|yet)\b/).map(s=>s.trim()).filter(Boolean); }
function mixups(t){
  const out = new Set();
  clauses(t).forEach(c=>{
    const L = /lamar/.test(c), H = /houston/.test(c);
    if(L === H) return; // skip clauses with neither or both names
    const neg = NEG.test(c);
    if(L && !neg && /(peace|friend|treat(y|ies)|get along|live together)/.test(c)) out.add("Check your facts: Lamar did not want peace with Native peoples. Reread Source B.");
    if(L && !neg && /(annex|join(ing|ed)? (the )?(u\.?s|united states|america))/.test(c) && /(want|support|favor|like|push|believ|for)/.test(c)) out.add("Check your facts: Lamar was against annexation. He wanted Texas to stay independent.");
    if(L && !neg && /(sav(e|ing)|cut|lower|reduc)\w*\b.{0,25}(money|spend|debt|cost)/.test(c)) out.add("Check your facts: Lamar spent a lot of money, and the debt grew.");
    if(H && !neg && /(remov|extermin|rigorous war|drive (them )?out|kick (them )?out|war (on|against))/.test(c)) out.add("Check your facts: Houston did not want to remove Native peoples. Reread Source C.");
    if(H && /(oppos|against|didn'?t want|did not want)\w*\b.{0,25}annex/.test(c)) out.add("Check your facts: Houston supported annexation.");
  });
  return [...out];
}
const VOCAB_RULES = {
  "annexation":{cue:/(join|oppos|against|support|independen|vote|united states|\bu\.?\s?s\b|america|became (a|part)|\bstate\b|statehood|add(ed|ing)?\b|part of|territory|land)/,
    bad:[[/annex\w*[^.]{0,40}\b(tax|owe|borrow|paid|pay)\b/, "“Annexation” is about adding land to a country, not about money or taxes."]],
    fix:"Your sentence uses “annexation,” but it doesn’t show what it means. Show Texas joining (or not joining) the United States."},
  "debt":{cue:/(owe|money|pay|paid|borrow|spen[dt]|cost|dollar|\$|million|gr[eo]w|increas|rose|bigger|larger|lower|reduc|cut|war|expens|broke)/,
    bad:[], fix:"Your sentence uses “debt,” but it doesn’t show what it means. Show money being owed, borrowed, or growing."},
  "tariff":{cue:/(tax|goods|import|ship|trade|items|products|cloth|tools|sugar|other countr|raise money|money|collect|sold|sell|buy|bought)/,
    bad:[[/tariffs?\b[^.]{0,30}\b(on|against)\s+(the\s+)?(cherokee|comanche|natives?|native americans|indians|people|tejanos|mexicans|tribes?|settlers)/, "A tariff is a tax on goods coming in from other countries, not on people."]],
    fix:"Your sentence uses “tariff,” but it doesn’t show what it means. Show what was taxed, like goods shipped into Texas."},
  "Manifest Destiny":{cue:/(belie|idea|thought|coast|pacific|atlantic|west|expan|spread|stretch|ocean|sea|land|grow|destin(y|ed) to)/,
    bad:[[/manifest destiny\s+(was|is)\s+(a\s+|the\s+)?(law|tax|war|battle|treaty|person|president|army|rule)/, "Manifest Destiny was a belief, not a law, war, or treaty."]],
    fix:"Your sentence uses “Manifest Destiny,” but it doesn’t show what it means. Show the belief that the U.S. should stretch coast to coast."}
};
function grade(e, raw){
  const text = (raw||"").trim(), t = text.toLowerCase(), len = text.length, C = [];
  const add = (ok, pass, fix) => C.push({ok, msg: ok ? pass : fix});
  if(e.kind === "compare"){
    const min = e.min[S.mode];
    add(/houston/.test(t) && /lamar/.test(t), "Names both presidents", "Name both Houston and Lamar.");
    add(/(native|indian|cherokee|comanche|tribe|bowles|annex|join|united states|independen|debt|spen[dt]|money|cost|tariff|expens|school|educat|universit|peace|war|fight|forc|remov|attack|capital|austin)/.test(t),
      "Says what they disagreed about", "Say what they disagreed about, like Native peoples, annexation, spending, or education.");
    add(/\b(but|while|whereas|however|unlike|instead|on the other hand|differ\w*|opposite|compared)\b/.test(t), "Shows the contrast", "Show the difference with a word like “but,” “while,” or “however.”");
    const letters = S.mode === "adv" ? "abcd" : "abc";
    const cite = new RegExp(`source\\s*[${letters}]\\b`).test(t) || /["“][^"”]{6,}["”]/.test(text);
    add(cite, "Backs it up with a source", `Back it up: name a source (like “Source ${S.mode==="adv"?"B":"C"}”) or quote it. The sources are on this page.`);
    if(S.mode !== "adv" && /source\s*d\b/.test(t)) add(false, "", "There’s no Source D in your lab. Use Source A, B, or C.");
    if(/source\s*a\b/.test(t) && !/(school|educat|learn|mind|universit|democra)/.test(t)) add(false, "", "Source A is about education. If you cite it, connect it to schools or learning, or pick the source that matches your point.");
    if(/source\s*c\b/.test(t) && !/(peace|treat|steal|friend|native|tribe|indian|chief|get along|fight)/.test(t)) add(false, "", "Source C is Houston’s message about peace with Native nations. Connect your point to that, or cite a different source.");
    mixups(t).forEach(m=>add(false, "", m));
    add(len >= min, "Explains enough", `Explain a little more. Aim for at least ${min} characters (you have ${len}).`);
  }
  if(e.kind === "vocab"){
    const need = e.need[S.mode], used = vocabHits(text), words = text.split(/\s+/).filter(Boolean).length;
    add(used.length >= need, need === 1 ? "Uses a vocab word" : "Uses two vocab words",
      used.length ? `Use at least ${need} vocab words. You used ${used.length}.` : "Use one of the vocab words: annexation, debt, tariff, or Manifest Destiny.");
    if(used.length){
      const defn = /\b(means|is when|is a word|is defined|definition)\b/.test(t);
      if(defn) add(false, "", "Don’t just define the word. Use it in a sentence about something that happened in the Republic of Texas.");
      let good = 0;
      used.forEach(w=>{
        const R = VOCAB_RULES[w]; const misuse = R.bad.find(([re])=>re.test(t));
        if(misuse){ add(false, "", misuse[1]); return; }
        if(!R.cue.test(t.replace(w.toLowerCase(),""))){ add(false, "", R.fix); return; }
        if(!defn) good++;
      });
      if(good >= need) add(true, need === 1 ? "Uses the word correctly" : "Uses both words correctly", "");
    }
    add(words >= 6, "Long enough to be a full sentence", "Write a full sentence, at least 6 words.");
    add(/^[A-Z"“]/.test(text) && /[.!?]["”]?$/.test(text), "Starts with a capital and ends with punctuation", "Start with a capital letter and end with a period.");
  }
  if(e.kind === "opinion"){
    const min = e.min[S.mode];
    add(/\b(yes|no|would|wouldn'?t|support|agree|disagree|against|for|oppose)\b/.test(t), "Takes a side", "Take a side: would you support Lamar’s plan or not?");
    add(/\b(because|since|so|reason|due to|that'?s why|as a result)\b/.test(t), "Gives a reason", "Give a reason. Try starting it with “because.”");
    add(len >= min, "Explains enough", `Explain a little more. Aim for at least ${min} characters (you have ${len}).`);
  }
  // fixes first, then passes
  return C.sort((a,b)=>a.ok - b.ok);
}
function showFeedback(e){
  const res = grade(e, S.exit[e.id]); const box = main.querySelector(`[data-fbk="${e.id}"]`); if(!box) return res;
  const ok = res.every(r=>r.ok);
  box.innerHTML = `<p class="fbk-status ${ok?"ok":"no"}">${ok ? "Looks good. Ready to submit." : `${res.filter(r=>!r.ok).length} thing${res.filter(r=>!r.ok).length>1?"s":""} to fix`}</p>

  box.hidden = false;
  return res;
}

const HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const SPW = {"‘":222,"’":222,"“":333,"”":333,"–":556,"—":1000,"•":350,"…":1000,"·":278,"í":278,"ñ":556,"é":556,"ó":556,"á":556,"ú":556};
const WIN = {"‘":"\x91","’":"\x92","“":"\x93","”":"\x94","–":"\x96","—":"\x97","•":"\x95","…":"\x85","\u00A0":" ","→":"->","✓":"v","✕":"x"};
function toWin(s){ let o=""; for(const ch of String(s)){ const c = ch.charCodeAt(0); if(c < 128) o += ch; else if(WIN[ch]) o += WIN[ch]; else if(c <= 255) o += ch; else o += "?"; } return o; }
const pstr = s => toWin(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/[\r\n\t]/g," ");

class PDFDoc{
  constructor(){ this.W=612; this.H=792; this.M=54; this.pages=[]; this.newPage(); }
  newPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.H-this.M; }
  ensure(h){ if(this.y - h < this.M + 18) this.newPage(); }
  tw(s,size,bold){ let w=0; for(const ch of s){ const c=ch.charCodeAt(0); w += (c>=32&&c<=126) ? HW[c-32] : (SPW[ch]||556); } return w*size/1000*(bold?1.08:1); }
  wrap(s,size,bold,maxW){
    const out=[]; let line="";
    for(const word of String(s).split(/\s+/).filter(Boolean)){
      const test = line ? line+" "+word : word;
      if(this.tw(test,size,bold) <= maxW){ line = test; continue; }
      if(line) out.push(line);
      if(this.tw(word,size,bold) > maxW){ let part=""; for(const ch of word){ if(this.tw(part+ch,size,bold) > maxW){ out.push(part); part=""; } part+=ch; } line = part; }
      else line = word;
    }
    out.push(line); return out;
  }
  textAt(s,x,y,size,bold,color){ this.cur.push(`BT /${bold?"F2":"F1"} ${size} Tf ${color.join(" ")} rg ${x.toFixed(2)} ${y.toFixed(2)} Td (${pstr(s)}) Tj ET`); }
  text(s,o={}){
    const size=o.size||10, bold=!!o.bold, color=o.color||[0.09,0.10,0.13], x=o.x||this.M, maxW=o.maxW||(this.W-this.M-x), lead=o.lead||1.4;
    String(s||"").split("\n").forEach(p=>{ this.wrap(p,size,bold,maxW).forEach(l=>{ this.ensure(size*lead); this.y -= size*lead; this.textAt(l,x,this.y,size,bold,color); }); });
    this.y -= (o.after||0);
  }
  gap(h){ this.y -= h; }
  rule(color=[0.86,0.87,0.88]){ this.ensure(6); this.y -= 4; this.cur.push(`${color.join(" ")} RG 0.75 w ${this.M} ${this.y.toFixed(2)} m ${this.W-this.M} ${this.y.toFixed(2)} l S`); this.y -= 8; }
  rect(x,y,w,h,color){ this.cur.push(`${color.join(" ")} rg ${x} ${y.toFixed(2)} ${w} ${h} re f`); }
  row(cells,o={}){
    const size=o.size||10, lead=1.4, wrapped=cells.map(c=>this.wrap(c.text,size,!!(c.bold||o.bold),c.w-8));
    const h = Math.max(...wrapped.map(w=>w.length))*size*lead + 6;
    this.ensure(h);
    if(o.fill) this.rect(this.M, this.y-h, this.W-2*this.M, h, o.fill);
    wrapped.forEach((lines,i)=>lines.forEach((l,j)=>this.textAt(l, cells[i].x+4, this.y-3-(j+1)*size*lead+2, size, !!(cells[i].bold||o.bold), o.color||[0.09,0.10,0.13])));
    this.y -= h;
    this.cur.push(`0.86 0.87 0.88 RG 0.5 w ${this.M} ${this.y.toFixed(2)} m ${this.W-this.M} ${this.y.toFixed(2)} l S`);
  }
  output(footer){
    const objs=[], add=s=>{ objs.push(s); return objs.length; };
    add("<< /Type /Catalog /Pages 2 0 R >>"); add(""); 
    add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const kids=[];
    this.pages.forEach((ops,i)=>{
      const f = `BT /F1 8 Tf 0.45 0.46 0.48 rg ${this.M} 30 Td (${pstr(footer)}) Tj ET BT /F1 8 Tf 0.45 0.46 0.48 rg ${this.W-this.M-60} 30 Td (${pstr(`Page ${i+1} of ${this.pages.length}`)}) Tj ET`;
      const stream = ops.join("\n")+"\n"+f;
      const c = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`));
    });
    objs[1] = `<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
    let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
    out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 255;
    return bytes;
  }
}

function buildReport(){
  const D = new PDFDoc(), M = D.M, W = D.W, ink=[0.09,0.10,0.13], gray=[0.36,0.37,0.38], blue=[0.24,0.42,0.88], red=[0.78,0.26,0.18];
  // header band
  D.rect(0, D.H-96, W, 96, [0.09,0.10,0.13]);
  D.textAt("Learning Lab 4: The Lamar Presidency", M, D.H-50, 18, true, [1,1,1]);
  D.textAt("Republic of Texas unit, Day 4  ·  Results report", M, D.H-70, 10, false, [0.75,0.78,0.85]);
  D.y = D.H-96-14;
  const when = new Date(S.finished).toLocaleString([], {weekday:"short", month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
  const col2 = M+260;
  [["Student", S.name, "Version", MODE_LABEL[S.mode]],["Class period", S.period, "Submitted", when],["Started", new Date(S.started).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}), "Time in lab", fmtMin(S.finished - S.started)]].forEach(r=>{
    D.y -= 16; D.textAt(r[0], M, D.y, 9, false, gray); D.textAt(r[1], M+80, D.y, 10, true, ink); D.textAt(r[2], col2, D.y, 9, false, gray); D.textAt(r[3], col2+80, D.y, 10, true, ink);
  });
  D.gap(18);
  // summary tiles
  const stats = [[`${accuracy()}%`,"right on the first try"],[`${allItems().length}`,"challenges cleared"],[`${totalWrong()}`,"wrong attempts"],[`${S.away||0}`,"times left the lab tab"]];
  const tw = (W-2*M)/4; D.ensure(52);
  D.rect(M, D.y-50, W-2*M, 50, [0.96,0.96,0.96]);
  stats.forEach((s,i)=>{ D.textAt(s[0], M+i*tw+12, D.y-24, 18, true, i===0?blue:ink); D.textAt(s[1], M+i*tw+12, D.y-40, 8, false, gray); });
  D.y -= 64;

  // section breakdown
  D.text("Section breakdown", {size:13, bold:true, after:6});
  const C = [{x:M,w:200},{x:M+200,w:80},{x:M+280,w:80},{x:M+360,w:80},{x:M+440,w:64}];
  D.row(["Section","Challenges","First try","Wrong tries","Time"].map((t,i)=>({...C[i], text:t})), {bold:true, size:9, fill:[0.96,0.96,0.96]});
  const ss = sectionStats();
  ss.rows.forEach(r=>D.row([r.title, String(r.n), `${r.first} of ${r.n}`, String(r.wrong), r.time].map((t,i)=>({...C[i], text:t})), {size:9.5}));
  D.row(["Exit ticket", String(exitQs().length), "-", "-", ss.exitTime].map((t,i)=>({...C[i], text:t})), {size:9.5});
  D.gap(20);

  // exit ticket
  D.text("Exit ticket", {size:13, bold:true, after:4});
  exitQs().forEach((e,i)=>{
    D.gap(6); D.text(`${i+1}. ${lab(e)}`, {size:10, bold:true, after:2});
    D.text(S.exit[e.id]||"", {size:10.5, x:M+12, lead:1.5, after:2});
    const n = (S.exitChecks||{})[e.id]||0;
    D.text(`Used “Check my answer” ${n} time${n===1?"":"s"}.`, {size:8.5, color:gray, x:M+12});
  });
  D.gap(20);

  // every challenge
  D.text("Challenge by challenge", {size:13, bold:true, after:2});
  D.text("Shows whether each answer was right on the first try, and what the student tried before getting it right.", {size:9, color:gray, after:4});
  let num = 0;
  SECTIONS.forEach(sec=>{
    D.gap(8); D.ensure(40); D.text(sec.title, {size:11, bold:true, color:blue, after:2}); D.rule();
    itemsOf(sec).forEach(it=>{
      num++; const r = S.ans[it.id]||{};
      D.ensure(36);
      D.text(`${num}. ${it.prompt}`, {size:9.5, bold:true, after:1});
      const res = r.first ? "Right on the first try" : r.correct ? `Correct after ${r.tries} tries` : "Not finished";
      D.text(`${KIND[it.t]}  ·  ${res}`, {size:8.5, color:r.first?gray:red, x:M+12, after:1});
      if(r.wrongs && r.wrongs.length) D.text(`Wrong tries: ${r.wrongs.map(w=>`“${w}”`).join("; ")}`, {size:8.5, color:gray, x:M+12});
      D.gap(5);
    });
  });
  return D.output(`${S.name}  ·  ${S.period}  ·  Learning Lab 4 (${MODE_LABEL[S.mode]})`);
}

function downloadPDF(){
  const msg = document.getElementById("copied");
  try{
    const bytes = buildReport();
    const blob = new Blob([bytes], {type:"application/pdf"});
    const safe = s => String(s).trim().replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
    const name = `Lab4_${safe(S.name)}_${safe(S.period)}.pdf`;
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    msg.textContent = `Downloaded “${name}.” Find it in your Downloads folder and turn it in on Google Classroom.`;
  }catch(err){
    msg.textContent = "The download didn’t work. Ask your teacher for help.";
  }
}

/* ============================================================
   START SCREEN
   ============================================================ */
let pickedMode = "";
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click", ()=>{ if(S.started) return; pickedMode = b.dataset.mode; syncModes(); document.getElementById("signMsg").textContent = ""; }));
function syncModes(){ const m = S.started ? S.mode : pickedMode;
  document.querySelectorAll(".mode").forEach(b=>{ const on = b.dataset.mode === m; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); b.disabled = !!S.started; }); }

function startLab(){
  const msg = document.getElementById("signMsg");
  if(!S.started){
    const n = document.getElementById("name").value.trim(), p = document.getElementById("period").value;
    if(!pickedMode){ msg.textContent = "Pick Regular or Advanced to start."; return; }
    if(n.length < 2){ msg.textContent = "Type your name to start."; document.getElementById("name").focus(); return; }
    if(!p){ msg.textContent = "Pick your class period to start."; document.getElementById("period").focus(); return; }
    msg.textContent = "";
    S.mode = pickedMode; S.name = n; S.period = p; S.started = Date.now(); save();
    syncSignin(); render();
  }
  if(S.finished){ document.getElementById("results").scrollIntoView(); return; }
  const target = document.getElementById("sec-"+(SECTIONS[S.done.length]||{id:"exit"}).id);
  if(target) target.scrollIntoView();
}
document.getElementById("startBtn").addEventListener("click", startLab);
["name","period"].forEach(id=>document.getElementById(id).addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); startLab(); } }));

function syncSignin(){
  const btn = document.getElementById("startBtn"), nm = document.getElementById("name"), pd = document.getElementById("period");
  nm.disabled = pd.disabled = !!S.started;
  if(S.started){ nm.value = S.name; pd.value = S.period; btn.textContent = S.finished ? "View results" : "Continue lab"; }
  else { btn.textContent = "Start lab"; }
  syncModes();
}

const resetAsk = document.getElementById("resetAsk");
document.getElementById("resetBtn").addEventListener("click", ()=>{ resetAsk.hidden = false; document.getElementById("resetNo").focus(); });
document.getElementById("resetNo").addEventListener("click", ()=>{ resetAsk.hidden = true; document.getElementById("resetBtn").focus(); });
document.getElementById("resetYes").addEventListener("click", ()=>{
  resetAsk.hidden = true;
  S = blank(); pickedMode = ""; selChip = null; try{ localStorage.removeItem(KEY); }catch(e){}
  document.getElementById("name").value = ""; document.getElementById("period").value = ""; document.getElementById("signMsg").textContent = "";
  syncSignin(); render(); onScroll(); window.scrollTo(0,0);
});

const bar = document.getElementById("bar"), hero = document.getElementById("top");
function onScroll(){ bar.classList.toggle("solid", window.scrollY > hero.offsetHeight - 70); }
window.addEventListener("scroll", onScroll, {passive:true});

document.addEventListener("visibilitychange", ()=>{ if(document.hidden && S.started && !S.finished){ S.away = (S.away||0) + 1; save(); } });

load(); syncSignin(); render(); onScroll();
})();
</script>
